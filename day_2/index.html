<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jessica Randall</title>
    <style>
      body {
        background-color: #141414;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }
      .card {
        background-color: #1f1f1f;
        width: 330px;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
      }
      .card img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
      }
      h1 {
        color: white;
        font-size: 22px;
        margin: 15px 0 5px 0;
      }
      .city {
        color: #c4f82a;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .bio {
        color: #cccccc;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .btn {
        display: block;
        background-color: #333333;
        color: white;
        text-decoration: none;
        padding: 13px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-weight: bold;
        font-size: 14px;
      }
      .btn:hover {
        background-color: #c4f82a;
        color: #141414;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://i.pravatar.cc/150?img=12" alt="avatar" />
      <h1>Jessica Randall</h1>
      <p class="city">London, United Kingdom</p>
      <p class="bio">"Front-end developer and avid reader."</p>

      <a class="btn" href="#">GitHub</a>
      <a class="btn" href="#">Frontend Mentor</a>
      <a class="btn" href="#">LinkedIn</a>
      <a class="btn" href="#">Twitter</a>
      <a class="btn" href="#">Instagram</a>
    </div>
  </body>
</html>
